[project]
name = "agent-control-plane"
version = "0.1.0"
description = "AI Agent Operations Platform — discover, inventory, monitor, and track costs for AI agents across your organization"
authors = [
    {name = "iknowkungfubar", email = "hello@turintech.solutions"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
agent-control-plane = "agent_control_plane.cli:main"
acp = "agent_control_plane.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "S101",   # assert allowed — we use pytest
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # docstrings pre-existing
    "TD001",  # todo without issue reference
    "ERA001", # commented-out code
    "FBT001", # boolean positional arg
    "FBT002", # boolean positional arg
    "FIX002", # line contains TODO
    "INP001", # implicit namespace
    "ISC001", # implicit string concat
    "EM101",  # str exception
    "EM102",  # f-string exception
    "N802",
    "N803",
    "PLR0913", # too many args
    "PLR2004", # magic value
    "S603",   # subprocess call
    "TD003",  # todo without issue
    "TRY003", # long exception message
    "G004",   # f-string in log
    "COM812", # conflicts with formatter
    "ANN202", # missing return type on private functions (pervasive)
    "CPY001", # copyright notices (not useful for internal files)
    "E501",   # line too long (100 is strict; pre-existing)
    "PLC0415", # late imports — intentional for lazy loading & circular import avoidance
    "C901",   # complexity — pre-existing, too pervasive
    "PLR0912", # too many branches — pre-existing design
    "PLR0915", # too many statements — pre-existing design
    "PLR0917", # too many positional arguments — pre-existing design
    "ANN001", # missing type annotations — pre-existing, pervasive
    "ANN401", # type annotation restrictions — pre-existing
    "ARG001", # unused function arguments — pervasive (test fixtures, callbacks)
    "PLW0603", # global statement usage — pre-existing design pattern
    "PLW2901", # loop variable overwrite — pre-existing pattern
    "RUF012", # mutable class defaults — pre-existing
    "S108",   # hardcoded tmp paths — pre-existing test patterns
    "RUF001", # ambiguous Unicode — pre-existing (uses ℹ for info icon in UI strings)
    "TRY300", # move to else block — pre-existing, minor style
    "SIM102", # nested if simplification — pre-existing readability choices
    "A002",   # builtin shadowing — pre-existing (format/builtin params)
    "D401",   # docstring imperative mood — pre-existing, formatting only
    "N806",   # UPPERCASE naming in functions — pre-existing constants pattern
    "SIM113", # enumerate instead of manual counter — pre-existing pattern
    "PTH123", # Path.open() instead of open() — pre-existing style
    "PERF401",# list comprehension instead of append loop — pre-existing readability choice
    "PLR0911",# too many return statements — pre-existing design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # assert allowed in tests
    "D",        # no docstrings needed in tests
    "ANN",      # no type annotations needed in tests
    "ARG001",   # unused arguments in test fixtures
    "ARG002",   # unused arguments in test fixtures
    "PLR2004",  # magic values in tests
    "S603",     # subprocess call in tests
    "TID252",   # relative imports in tests
    "SLF001",   # accessing private members in tests
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["agent_control_plane"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.coverage.html]
directory = "coverage_html"
